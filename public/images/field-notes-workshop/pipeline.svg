<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" role="img" aria-label="Build pipeline: MDX to static site">
  <style>
    .box { fill: none; stroke: #1d1c1a; stroke-width: 1.5; }
    .lbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #1d1c1a; }
    .sub { font-family: ui-monospace, monospace; font-size: 10px; fill: #6b6862; }
    .arr { stroke: #b4502a; stroke-width: 1.5; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4502a"/>
    </marker>
  </defs>

  <rect class="box" x="12" y="40" width="160" height="60" rx="6"/>
  <text class="lbl" x="92" y="66" text-anchor="middle">MDX + frontmatter</text>
  <text class="sub" x="92" y="84" text-anchor="middle">content/posts/{en,it}</text>

  <line class="arr" x1="176" y1="70" x2="268" y2="70"/>

  <rect class="box" x="272" y="40" width="170" height="60" rx="6"/>
  <text class="lbl" x="357" y="66" text-anchor="middle">posts.ts + Zod</text>
  <text class="sub" x="357" y="84" text-anchor="middle">parse · validate · sort</text>

  <line class="arr" x1="446" y1="70" x2="538" y2="70"/>

  <rect class="box" x="542" y="40" width="166" height="60" rx="6"/>
  <text class="lbl" x="625" y="66" text-anchor="middle">out/ (static)</text>
  <text class="sub" x="625" y="84" text-anchor="middle">next build · pagefind</text>
</svg>
