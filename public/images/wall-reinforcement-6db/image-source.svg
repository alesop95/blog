<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">Method of images</title>
  <desc id="desc">A real source S in front of a rigid wall is equivalent to S plus a mirror image source S′, in phase, behind the wall.</desc>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#1d1c1a">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a" />
      </marker>
    </defs>

    <line x1="70" y1="190" x2="570" y2="190" stroke="#1d1c1a" stroke-opacity="0.3" stroke-dasharray="4 5" />

    <g fill="none" stroke="#1d1c1a" stroke-opacity="0.22">
      <path d="M 180,150 A 45,45 0 0 1 180,230" />
      <path d="M 180,120 A 75,75 0 0 1 180,260" />
      <path d="M 180,95 A 100,100 0 0 1 180,285" />
    </g>

    <line x1="320" y1="50" x2="320" y2="305" stroke="#1d1c1a" stroke-width="3" />
    <g stroke="#1d1c1a" stroke-width="1.4" stroke-opacity="0.65">
      <line x1="320" y1="70" x2="337" y2="56" />
      <line x1="320" y1="100" x2="337" y2="86" />
      <line x1="320" y1="130" x2="337" y2="116" />
      <line x1="320" y1="160" x2="337" y2="146" />
      <line x1="320" y1="190" x2="337" y2="176" />
      <line x1="320" y1="220" x2="337" y2="206" />
      <line x1="320" y1="250" x2="337" y2="236" />
      <line x1="320" y1="280" x2="337" y2="266" />
    </g>

    <line x1="180" y1="150" x2="320" y2="150" stroke="#1d1c1a" marker-start="url(#ah)" marker-end="url(#ah)" />
    <line x1="320" y1="150" x2="460" y2="150" stroke="#1d1c1a" marker-start="url(#ah)" marker-end="url(#ah)" />
    <text x="250" y="142" text-anchor="middle" font-size="16" font-style="italic">d</text>
    <text x="390" y="142" text-anchor="middle" font-size="16" font-style="italic">d</text>

    <circle cx="180" cy="190" r="7" fill="#1d1c1a" />
    <text x="180" y="172" text-anchor="middle" font-size="17" font-weight="600">S</text>
    <text x="180" y="226" text-anchor="middle" font-size="12.5" fill-opacity="0.7">real source</text>

    <circle cx="460" cy="190" r="7" fill="#c8772f" fill-opacity="0.15" stroke="#c8772f" stroke-width="2" stroke-dasharray="3 3" />
    <text x="460" y="172" text-anchor="middle" font-size="17" font-weight="600" fill="#c8772f">S&#8242;</text>
    <text x="460" y="226" text-anchor="middle" font-size="12.5" fill-opacity="0.7">image source</text>

    <text x="320" y="328" text-anchor="middle" font-size="12.5" fill-opacity="0.7">rigid wall (Neumann)</text>
  </g>
</svg>
